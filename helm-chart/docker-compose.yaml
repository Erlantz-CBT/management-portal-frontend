services:
  frontend:
    container_name: management-portal-frontend
    image: registry.gitlab.aeros-project.eu/aeros-public/common-deployments/management-portal/frontend:1.0.0-mvp
    ports:
      - 80:80
    volumes:
      - ${PWD}/config/keycloak.json:/usr/share/nginx/html/keycloak.json
      - ${PWD}/config/managementportal.conf:/etc/nginx/conf.d/managementportal.conf

  backend:
    container_name: management-portal-backend
    depends_on:
      - frontend
    image: registry.gitlab.aeros-project.eu/aeros-public/common-deployments/management-portal/backend:1.0.0-mvp
    ports:
      - 8080:8080
    environment:
      - LOG_LEVEL=DEBUG
      - SECURITY_LOG_LEVEL=DEBUG
      - ORION_URL=http://127.0.0.1:1026/ngsi-ld/v1/entities
      - KEYCLOAK_URL=https://keycloak.cf-mvp-domain.aeros-project.eu/auth/realms/keycloack-openldap/protocol/openid-connect/certs
      - HLO_FE_URL=http://127.0.0.1:8081
