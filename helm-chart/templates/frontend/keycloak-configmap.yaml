apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-keycloak-config" (include "frontend.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  keycloak.json: |
    {
      {{- with .Values.frontend.keycloak }}
      "realm": {{ .realm | quote }},
      "auth-server-url": {{ .url | quote }},
      "ssl-required": {{ .sslRequired | quote }},
      "resource": {{ .resource | quote }},
      "responseMode": {{ .responseMode | quote }},
      "pkceMethod": {{ .pkceMethod | quote }}
      {{- end }}
    }