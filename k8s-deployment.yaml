apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: management-portal-frontend
  name: management-portal-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: management-portal-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: management-portal-frontend
    spec:
      imagePullSecrets:
        - name: aeros-common-deployments
      containers:
      - name: frontend
        image: registry.gitlab.aeros-project.eu/aeros-public/common-deployments/management-portal/frontend:1.0.0-mvp
        ports:
        - containerPort: 80
          name: api
          protocol: TCP
        volumeMounts:
        - name: keycloak-config-volume
          mountPath: /usr/share/nginx/html/keycloak.json
          subPath: keycloak.json
        - name: proxy-config-volume
          mountPath: /etc/nginx/conf.d
      volumes:
        - name: keycloak-config-volume
          configMap:
            name: portal-keycloak-config
        - name: proxy-config-volume
          configMap:
            name: portal-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: management-portal-frontend
  name: management-portal-frontend
  namespace: default
spec:
  type: NodePort
  ports:
  - name: web
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/component: management-portal-frontend
